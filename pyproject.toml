[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymagical"
dynamic = ["version"]
description = "A Python port of the MAGICAL hierarchical Bayesian Gibbs sampler for regulatory circuit inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "C. Sun", email = "cs9095@princeton.edu" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "statsmodels>=0.13.0",
    "pyarrow>=8.0.0",
    "numba>=0.64.0",
]

[project.optional-dependencies]
viz = [
    "jinja2>=3.1.6",
    "plotly>=6.5.2",
]

[project.scripts]
pymagical = "pymagical.cli:main"

[project.urls]
Documentation = "https://github.com/csun0/pymagical/blob/main/README.md"
Repository = "https://github.com/csun0/pymagical"
Issues = "https://github.com/csun0/pymagical/issues"

[tool.hatch.version]
source = "vcs"
# Fall back to a static version when building outside a git checkout (e.g. a
# release tarball, a GitHub zip, or a shallow clone with no tags) so the build
# never hard-fails. Tagged git builds still derive the real version.
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
include = ["src/pymagical", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/pymagical"]

# Developer tooling (PEP 735). Installed by `uv sync` automatically; not part of
# the published wheel. Bundles the viz libs so `pymagical viz` works locally.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "jinja2>=3.1.6",
    "plotly>=6.5.2",
]
