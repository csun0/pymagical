[project]
name = "pymagical"
version = "0.1.0"
description = "A Python port of the MAGICAL hierarchical Bayesian Gibbs sampler for regulatory circuit inference."
authors = [
    { name = "C. Sun", email = "cs9095@princeton.edu" }
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "statsmodels>=0.13.0",
    "pyarrow>=8.0.0",
]
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
magical = "pymagical.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["pymagical", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["pymagical"]
