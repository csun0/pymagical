[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pymagical"
dynamic = ["version"]
description = "A Python port of the MAGICAL hierarchical Bayesian Gibbs sampler for regulatory circuit inference."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "C. Sun", email = "cs9095@princeton.edu" }
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "pandas>=1.4.0",
    "statsmodels>=0.13.0",
    "pyarrow>=8.0.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "anndata>=0.11.4",
    "pyfonts>=1.2.0",
    "numba>=0.64.0",
    "jinja2>=3.1.6",
    "plotly>=6.5.2",
]

[project.scripts]
pymagical = "pymagical.cli:main"

# Move ALL tool sections to the bottom
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
include = ["pymagical", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["pymagical"]
